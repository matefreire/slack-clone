services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: slack-clone-app
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
    volumes:
      - ..:/app
      - slack_clone_node_modules:/app/node_modules
      - slack_clone_next:/app/.next
    command: sh -c "npm install && npm run dev:docker"

volumes:
  slack_clone_node_modules:
  slack_clone_next: